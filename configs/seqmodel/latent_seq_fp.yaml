model:
  base_learning_rate: 5e-5
  target: ldm.models.seq_diffusion.LatentSeqDiffusion
  params:
    monitor: "val/loss_simple"
    timesteps: 1000
    beta_start: 1e-4
    beta_end: 2e-2
    scale_factor: 0.208826   # = 1/潜变量std（128张切片实测 std=4.788671）；encode 乘 / decode 除（LDM 惯例），使扩散在 std≈1 的潜空间进行
    ckpt_path: ""            # S3 断点续训时填 logs/.../checkpoints/last.ckpt
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        ckpt_path: logs/best-epoch=0999-step=1280000.ckpt   # VAE 训练权重（epoch999/step1.28M, PSNR 40.4dB）
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [ 1,2,4,4 ]
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
    seqmodel_config:
      target: ldm.modules.seqmodel.CausalSliceTransformer
      params:
        latent_channels: 4
        latent_size: 32
        d_model: 256
        num_layers: 4
        num_heads: 8
        dim_feedforward: 1024
        dropout: 0.1
        max_seq_len: 16

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4
    wrap: True
    num_workers: 4
    train:
      target: ldm.data.seq_slices.SeqSlicesTrain
      params:
        data_root: data/fingerprint/UESTC
        context_window: 4
        input_size: 256
        stride: 1
        train_volumes: [fig3_denoise, fig8_original_oct_image, fig4_5_p0004, fig4_5_p0019]
    validation:
      target: ldm.data.seq_slices.SeqSlicesValidation
      params:
        data_root: data/fingerprint/UESTC
        context_window: 4
        input_size: 256
        stride: 4
        val_volumes: [fig4_5_p0013]

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 2000
        max_images: 4
        increase_log_steps: True
  trainer:
    devices: "0,"            # 服务器按需改，如 "0,1,"
    precision: "16-mixed"
    benchmark: True
    max_epochs: 30
