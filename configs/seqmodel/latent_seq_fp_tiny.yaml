model:
  base_learning_rate: 1e-4
  target: ldm.models.seq_diffusion.LatentSeqDiffusion
  params:
    monitor: "val/loss_simple"
    timesteps: 100
    scale_factor: 1.0
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        ckpt_path: ""
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [ 1,2,4,4 ]
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
    seqmodel_config:
      target: ldm.modules.seqmodel.CausalSliceTransformer
      params:
        latent_channels: 4
        latent_size: 32
        d_model: 32
        num_layers: 1
        num_heads: 4
        dim_feedforward: 64
        dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1
    wrap: True
    num_workers: 0
    train:
      target: ldm.data.seq_slices.SeqSlicesTrain
      params:
        data_root: data/fingerprint/UESTC
        context_window: 4
        input_size: 256
        max_windows_per_folder: 4
        train_volumes: [fig3_denoise]
    validation:
      target: ldm.data.seq_slices.SeqSlicesValidation
      params:
        data_root: data/fingerprint/UESTC
        context_window: 4
        input_size: 256
        max_windows_per_folder: 2
        val_volumes: [fig4_5_p0013]

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1
        max_images: 2
    cuda_callback:            # main.CUDACallback 假设 CUDA 设备，CPU 冒烟时替换为无操作基类
      target: lightning.pytorch.callbacks.Callback
  trainer:
    max_epochs: 1
    limit_train_batches: 2
    limit_val_batches: 1
